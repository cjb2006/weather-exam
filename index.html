<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 响应式视口 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天气预报网页应用</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: linear-gradient(120deg, #4facfe, #00f2fe);
            min-height: 100vh;
            padding: 40px 16px;
        }
        /* 主容器 */
        main {
            max-width: 800px;
            margin: 0 auto;
        }
        /* 搜索区域 */
        section.search-area {
            background-color: #fff;
            border-radius: 18px;
            padding: 22px;
            display: flex;
            flex-wrap: wrap;
            gap:12px;
            margin-bottom:20px;
        }
        #city-input {
            flex:1;
            min-width:200px;
            padding:13px 16px;
            border:1px solid #ddd;
            border-radius: 10px;
            font-size:16px;
        }
        button {
            padding:13px 20px;
            border:none;
            border-radius:10px;
            cursor:pointer;
            font-size:15px;
            transition: all 0.25s;
        }
        #search-btn {
            background-color:#0984e3;
            color:#fff;
        }
        #search-btn:hover {
            background-color:#076cb9;
        }
        #location-btn {
            background-color:#00b894;
            color:#fff;
        }
        #location-btn:hover {
            background-color:#009c7d;
        }
        /* 天气卡片 */
        .weather-card {
            background: rgba(255,255,255,0.92);
            border-radius:18px;
            padding:26px;
            display:none;
        }
        .current-weather {
            display:flex;
            flex-wrap:wrap;
            justify-content:space-between;
            align-items:center;
            margin-bottom:24px;
        }
        .temp-value {
            font-size:54px;
            font-weight:bold;
            color:#2d3436;
        }
        .info-item {
            margin: 8px 0;
            font-size:16px;
        }
        /* 预报网格 响应式 */
        .forecast-container {
            display:grid;
            grid-template-columns: repeat(auto-fit, minmax(135px,1fr));
            gap:14px;
        }
        .day-item {
            background:#ffffff;
            padding:16px 10px;
            border-radius:14px;
            text-align:center;
            box-shadow:0 2px 6px #00000015;
        }
        .high-temp {
            color:#d63031;
            font-weight:bold;
        }
        .low-temp {
            color:#0984e3;
        }
        .tip-text {
            text-align:center;
            color:#fff;
            margin-top:12px;
        }
    </style>
</head>
<body>
    <!-- HTML5语义标签 main section -->
    <main>
        <section class="search-area">
            <input id="city-input" placeholder="输入城市英文名，如guangzhou">
            <button id="search-btn">查询天气</button>
            <button id="location-btn">📍获取当前位置天气</button>
        </section>

        <section class="weather-card" id="weather-box">
            <div class="current-weather">
                <div>
                    <h2 id="city-name"></h2>
                    <p id="weather-status"></p>
                </div>
                <div class="temp-value" id="now-temp"></div>
            </div>
            <div class="info-item">湿度：<span id="humidity"></span></div>
            <div class="info-item">风速：<span id="wind-speed"></span> m/s</div>
            <h3 style="margin-top:24px;margin-bottom:16px">未来5天预报</h3>
            <div class="forecast-container" id="forecast-wrap"></div>
        </section>
        <p class="tip-text">提示：OpenWeather城市名需要英文，刷新页面自动加载上次查询城市</p>
    </main>

    <script>
        // 👉 替换为你的 OpenWeather API KEY
        const API_KEY = "9497577e383ea15fa3d11405ef48af5c";

        // 获取DOM元素
        const weatherBox = document.querySelector("#weather-box");
        const cityName = document.querySelector("#city-name");
        const weatherStatus = document.querySelector("#weather-status");
        const nowTemp = document.querySelector("#now-temp");
        const humidity = document.querySelector("#humidity");
        const windSpeed = document.querySelector("#wind-speed");
        const forecastWrap = document.querySelector("#forecast-wrap");
        const cityInput = document.querySelector("#city-input");
        const searchBtn = document.querySelector("#search-btn");
        const locationBtn = document.querySelector("#location-btn");

        // ES6 async 箭头函数，根据城市名称查询天气
        const getWeatherByCity = async (cityNameStr) => {
            try{
                // 获取实时天气
                const weatherUrl = `https://api.openweathermap.org/data/2.5/weather?q=${cityNameStr}&appid=${API_KEY}&units=metric&lang=zh_cn`;
                const resp1 = await fetch(weatherUrl);
                if(!resp1.ok) throw new Error("城市不存在");
                const weatherData = await resp1.json();

                // 本地存储持久化 localStorage【加分项5】
                localStorage.setItem("lastSearchCity", cityNameStr);

                // 获取5天预报
                const forecastUrl = `https://api.openweathermap.org/data/2.5/forecast?q=${cityNameStr}&appid=${API_KEY}&units=metric&lang=zh_cn`;
                const resp2 = await fetch(forecastUrl);
                const forecastData = await resp2.json();

                renderCurrent(weatherData);
                renderForecast(forecastData);
                weatherBox.style.display = "block";
            }catch(err){
                alert("查询失败：" + err.message);
                weatherBox.style.display = "none";
            }
        }

        // 根据经纬度查询（定位【加分项4】Geolocation API）
        const getWeatherByGeo = async (lat, lon) => {
            try{
                const weatherUrl = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=zh_cn`;
                const resp1 = await fetch(weatherUrl);
                const weatherData = await resp1.json();

                const forecastUrl = `https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=zh_cn`;
                const resp2 = await fetch(forecastUrl);
                const forecastData = await resp2.json();

                localStorage.setItem("lastSearchCity", weatherData.name);
                cityInput.value = weatherData.name;
                renderCurrent(weatherData);
                renderForecast(forecastData);
                weatherBox.style.display = "block";
            }catch(err){
                alert("定位查询失败：" + err.message);
            }
        }

        // 渲染当前天气
        const renderCurrent = (data) => {
            cityName.textContent = data.name;
            weatherStatus.textContent = data.weather[0].description;
            nowTemp.textContent = `${data.main.temp} ℃`;
            humidity.textContent = `${data.main.humidity} %`;
            windSpeed.textContent = data.wind.speed;
        }

        // 渲染未来预报，包含最高最低温度，最多5天
        const renderForecast = (forecastData) => {
            forecastWrap.innerHTML = "";
            // 筛选每日中午数据
            const dayList = forecastData.list.filter(item => item.dt_txt.includes("12:00:00"));
            dayList.slice(0,5).forEach(item => {
                const div = document.createElement("div");
                div.className = "day-item";
                div.innerHTML = `
                    <div>${item.dt_txt.slice(5,10)}</div>
                    <div>${item.weather[0].description}</div>
                    <div class="high-temp">最高 ${item.main.temp_max}℃</div>
                    <div class="low-temp">最低 ${item.main.temp_min}℃</div>
                `;
                forecastWrap.appendChild(div);
            })
        }

        // =========功能1 搜索：点击查询，非空校验========
        searchBtn.addEventListener("click", ()=>{
            const city = cityInput.value.trim();
            if(!city){
                alert("请输入城市名称！");
                return;
            }
            getWeatherByCity(city);
        })
        // 回车触发搜索
        cityInput.addEventListener("keydown", (e)=>{
            if(e.key === "Enter"){
                searchBtn.click();
            }
        })

        // 定位按钮点击事件
        locationBtn.addEventListener("click", ()=>{
            if(!navigator.geolocation){
                alert("浏览器不支持定位");
                return;
            }
            navigator.geolocation.getCurrentPosition(
                pos => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    getWeatherByGeo(lat, lon);
                },
                err => {
                    alert("获取位置失败，请开启位置权限：" + err.message);
                }
            )
        })

        // 页面加载，读取localStorage自动加载上次城市
        window.onload = () => {
            const savedCity = localStorage.getItem("lastSearchCity");
            if(savedCity){
                cityInput.value = savedCity;
                getWeatherByCity(savedCity);
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 响应式viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天气预报应用</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            min-height: 100vh;
            padding: 30px 15px;
        }
        main {
            max-width: 800px;
            margin: 0 auto;
        }
        .search-box {
            background: #fff;
            padding: 20px;
            border-radius: 16px;
            display: flex;
            gap:10px;
            margin-bottom:20px;
        }
        #cityInput {
            flex: 1;
            padding:12px 16px;
            border: 1px solid #ddd;
            border-radius:8px;
            font-size:16px;
        }
        #searchBtn {
            padding:12px 24px;
            background:#0984e3;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            transition: 0.3s;
        }
        #searchBtn:hover{
            background:#0769b4;
        }
        .weather-card{
            background:#ffffffdd;
            border-radius:16px;
            padding:24px;
            margin-bottom:20px;
        }
        .current{
            display:flex;
            flex-wrap:wrap;
            justify-content: space-between;
            align-items:center;
        }
        .temp{
            font-size: 48px;
            font-weight:bold;
        }
        .forecast-wrap{
            display:grid;
            grid-template-columns: repeat(auto-fit, minmax(130px,1fr));
            gap:12px;
            margin-top:20px;
        }
        .day-card{
            background:#fff;
            padding:14px;
            border-radius:12px;
            text-align:center;
        }
        .tip{
            text-align:center;
            color:#fff;
            margin-top:10px;
        }
        .error{
            color:red;
            text-align:center;
            padding:15px;
        }
    </style>
</head>
<body>
    <main>
        <section class="search-box">
            <input type="text" id="cityInput" placeholder="输入城市英文名，例如 guangzhou">
            <button id="searchBtn">查询天气</button>
        </section>

        <section class="weather-card" id="weatherBox" style="display:none;">
            <div class="current">
                <div>
                    <h2 id="cityName"></h2>
                    <p id="desc"></p>
                </div>
                <div class="temp" id="tempText"></div>
            </div>
            <div>湿度：<span id="humidity"></span></div>
            <div>风速：<span id="wind"></span> m/s</div>
            <h3 style="margin-top:20px;">未来5天预报</h3>
            <div class="forecast-wrap" id="forecastBox"></div>
        </section>
        <p class="tip">提示：OpenWeather 城市名需要英文，如 beijing、shanghai</p>
    </main>

    <script>
        // 👉 替换成你自己申请的OpenWeather API KEY
        const API_KEY = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx";
        const weatherBox = document.querySelector('#weatherBox');
        const cityNameEl = document.querySelector('#cityName');
        const descEl = document.querySelector('#desc');
        const tempTextEl = document.querySelector('#tempText');
        const humidityEl = document.querySelector('#humidity');
        const windEl = document.querySelector('#wind');
        const forecastBox = document.querySelector('#forecastBox');
        const cityInput = document.querySelector('#cityInput');
        const searchBtn = document.querySelector('#searchBtn');

        // ES6箭头函数，async/await
        const fetchWeather = async (city) => {
            try {
                // 获取实时天气
                const weatherUrl = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric&lang=zh_cn`;
                const weatherRes = await fetch(weatherUrl);
                if(!weatherRes.ok) throw new Error("城市不存在");
                const weatherData = await weatherRes.json();

                // 获取5天预报
                const forecastUrl = `https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${API_KEY}&units=metric&lang=zh_cn`;
                const forecastRes = await fetch(forecastUrl);
                const forecastData = await forecastRes.json();

                // 渲染当前天气
                cityNameEl.textContent = weatherData.name;
                descEl.textContent = weatherData.weather[0].description;
                tempTextEl.textContent = `${weatherData.main.temp} ℃`;
                humidityEl.textContent = `${weatherData.main.humidity} %`;
                windEl.textContent = weatherData.wind.speed;

                // 渲染5天预报，取每天中午的数据
                forecastBox.innerHTML = "";
                // 筛选中午12点的数据
                const dayList = forecastData.list.filter(item=> item.dt_txt.includes("12:00:00"));
                dayList.forEach(item => {
                    const div = document.createElement('div');
                    div.className = "day-card";
                    div.innerHTML = `
                        <div>${item.dt_txt.slice(5,10)}</div>
                        <div>${item.weather[0].description}</div>
                        <div>${item.main.temp} ℃</div>
                    `;
                    forecastBox.appendChild(div);
                })
                weatherBox.style.display="block";
            } catch(err) {
                weatherBox.style.display="none";
                alert(err.message || "获取天气失败，请检查城市名或API密钥");
            }
        }

        // 点击查询
        searchBtn.addEventListener('click', ()=>{
            const city = cityInput.value.trim();
            if(city){
                fetchWeather(city);
            }else{
                alert("请输入城市名称！")
            }
        })
        // 回车也可以查询
        cityInput.addEventListener('keydown', (e)=>{
            if(e.key === 'Enter'){
                searchBtn.click();
            }
        })
    </script>
</body>
</html>
